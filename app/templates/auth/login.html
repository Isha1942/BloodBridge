{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex justify-center bg-gradient-to-br from-blue-50 to-white py-4 px-4 sm:px-6 lg:px-8 pt-20">
  <div class="max-w-md w-full space-y-8">
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-100 rounded-full mb-4">
        <i class="fas fa-user text-blue-600 text-3xl"></i>
      </div>
      <h2 class="text-3xl font-extrabold text-gray-900">
        Sign in to your <span class="text-blue-600">Account</span>
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Or
        <a href="{{ url_for('auth.register', user_type='donor') }}" class="font-medium text-blue-600 hover:text-blue-500">
          create a new account
        </a>
      </p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4">
        <h2 class="text-xl font-bold text-white">Welcome Back</h2>
        <p class="text-blue-100 text-sm">Please enter your credentials</p>
      </div>

      <form class="p-6 space-y-5" action="{{ url_for('auth.login') }}" method="POST">
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">
            <i class="fas fa-envelope text-blue-500 mr-1"></i>Email address
          </label>
          <input id="email" name="email" type="email" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Email address" />
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">
            <i class="fas fa-lock text-blue-500 mr-1"></i>Password
          </label>
          <input id="password" name="password" type="password" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Password" />
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember_me" name="remember_me" type="checkbox"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
            <label for="remember_me" class="ml-2 block text-sm text-gray-900">Remember me</label>
          </div>
          <div class="text-sm">
            <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Forgot your password?</a>
          </div>
        </div>

        <button type="submit"
          class="w-full flex justify-center items-center py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all duration-200 font-semibold text-lg">
          <i class="fas fa-sign-in-alt mr-2"></i>Sign in
        </button>
      </form>
    </div>

    <p class="text-center text-gray-500 text-sm mt-6">
      Don't have an account?
      <a href="{{ url_for('auth.register', user_type='donor') }}" class="text-blue-600 hover:text-blue-700 font-medium">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
